[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minutenest"
version = "0.4.0"
description = "Every meeting, written down: local transcription with optional LLM notes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "comtypes>=1.4",       # WebView2 native window (Windows)
    "certifi",             # bundled CA roots so cloud LLMs work on clean machines
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.30"]
dev = ["pytest>=8.0", "httpx>=0.27", "playwright>=1.40", "ruff>=0.14", "pyright>=1.1.400", "bandit>=1.8"]

[project.scripts]
minutenest = "minutenest.cli:main"

[tool.setuptools.packages.find]
include = ["minutenest*"]

[tool.setuptools.package-data]
minutenest = [
    "profiles/*.json",
    "webapp/templates/*.html",
    "webapp/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--browser-channel msedge --screenshot only-on-failure --tracing retain-on-failure --output tests/artifacts"

# ---- static analysis (QUALITY.md: Power of Ten rule 10, ISO/IEC 5055) -------
# Every check below runs with zero findings; each ignored rule says why.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["work", "dist", "build", "tests/artifacts", ".playwright-mcp"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "B",            # bugbear: likely bugs
    "C90",          # cyclomatic complexity (Power of Ten 1)
    "PL",           # pylint: size limits, globals, comparisons
    "S",            # flake8-bandit: security weaknesses (ISO/IEC 5055, CWE)
    "BLE",          # blind except (reliability)
    "TRY",          # exception handling
    "SIM", "UP", "RUF", "PERF", "RET", "ARG", "PIE",
]
ignore = [
    # Imports inside functions are deliberate: heavy modules (faster_whisper,
    # ctranslate2, comtypes) load only when used, which keeps the window's start
    # fast on a slow PC, and they break import cycles between the web app and
    # the pipeline.
    "PLC0415",
    # Error messages are user-facing text, written where the error happens.
    "TRY003",
    # HTTP status codes (401, 429, 529...) and measured thresholds that carry
    # a comment with their source.
    "PLR2004",
    # try/except inside a loop: entering a try block costs nothing since Python
    # 3.11 (zero-cost exceptions); the app is built and tested on 3.11+.
    "PERF203",
    # `return` inside `try` keeps the success path next to the call it depends on;
    # it cannot hide an exception.
    "TRY300",
    # Process-wide state (one server, one job worker, one live-update loop, the
    # caches) lives at module scope, the smallest scope it can have; each such
    # global is written under a lock.
    "PLW0603",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# tests: plain asserts are how pytest checks; test helpers start real processes;
# Russian and other non-ASCII text is test data (RUF001)
"tests/**" = ["S101", "S603", "S607", "S310", "ARG001", "PLR0913", "PLR0917", "RUF001"]
# the stand-in servers: every handler has the same (method, path, query, headers,
# body) signature, and an HTTP dispatch returns once per route
"tests/support/llm_server.py" = ["ARG002", "PLR0911"]

[tool.pyright]
include = ["minutenest", "launcher.py", "cli_entry.py", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.bandit]
exclude_dirs = ["tests", "work", "dist", "build", ".venv"]
